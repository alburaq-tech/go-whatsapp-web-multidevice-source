services:
  whatsapp_go:
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"
    build:
      context: .
      dockerfile: ./docker/golang.Dockerfile
    restart: unless-stopped
    ports:
      - "100.101.113.22:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -S -O /dev/null http://127.0.0.1:3000/ 2>&1 | grep -qE 'HTTP/1\\.[01] (200|401)'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      - logs_data:/app/logs
      - storages_data:/app/storages
    env_file:
      - src/.env

  vector_agent:
    image: timberio/vector:0.45.0-alpine
    volumes:
      - ./vector/agent.yaml:/etc/vector/vector.yaml:ro
      - logs_data:/app/logs
    environment:
      VECTOR_AGGREGATOR_HOST: ${VECTOR_AGGREGATOR_HOST:-host.docker.internal:8686}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    entrypoint: ["sh", "-c", "mkdir -p /tmp/vector-agent && vector --config /etc/vector/vector.yaml"]
    restart: unless-stopped
    depends_on:
      - whatsapp_go

volumes:
  logs_data:
  storages_data: